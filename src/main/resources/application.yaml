server:
  port: 8080  # 设置启动端口
spring:
  datasource:  # 数据源信息
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smarthomesys?serverTimezone=GMT%2B8
    username: root
    password: 123456
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER # swagger3之后需要设置
  mail: # 邮箱配置
    default-encoding: utf-8 # 邮箱默认编码
    host: smtp.qq.com # 邮箱服务器名
    username: lzpBright@qq.com  # 发送账户
    password: eeddhsgikcntdefe  # 有限授权码
    port: 587 # 服务器端口
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 设置mybatis-plus的log
  mapper-locations: classpath:mapperXML/*.xml # mapperXML的地址
  global-config:
    db-config:
      logic-not-delete-value: 0 # 逻辑删除，0表示没有删除
      logic-delete-value: 1 # 逻辑删除，1表示删除
      logic-delete-field: deleted # deleted作为逻辑删除辅助字段
      id-type: assign_id  # 对于主键，均采取雪花算法自动生成19位长度
  type-aliases-package: com.lzp.smarthomesys.entity # 取别名，这样xml文件的返回类型只要写一个Student就可以了